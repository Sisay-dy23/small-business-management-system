<!DOCTYPE html>
<html>

<head>
    <title>Business Management System</title>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #0d6efd;
        }
        

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #0d6efd;
            color: white;
        }

        button:hover {
            background-color: #084298;
        }

        .delete {
            background-color: red;
        }

        .delete:hover {
            background-color: darkred;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            margin: 30px 0;
        }

        .card {
            background-color: white;
            padding: 20px;
            width: 180px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 5px gray;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        li {
            margin: 15px;
        }

    </style>

</head>


<body>

    <h1>Small Business Management System</h1>


    <!-- ========================= -->
    <!-- DASHBOARD -->
    <!-- ========================= -->

    <div class="dashboard">

        <div class="card">
            <h3>Products</h3>
            <p id="totalProducts">0</p>
        </div>

        <div class="card">
            <h3>Total Stock</h3>
            <p id="totalStock">0</p>
        </div>

        <div class="card">
            <h3>Inventory Value</h3>
            <p id="totalValue">0 ETB</p>
        </div>

    </div>


    <!-- ========================= -->
    <!-- ADD PRODUCT -->
    <!-- ========================= -->

    <section>

        <h2>Add Product</h2>

        <input
            type="text"
            id="productName"
            placeholder="Product name"
        >

        <input
            type="number"
            id="productPrice"
            placeholder="Price"
        >

        <input
            type="number"
            id="productQuantity"
            placeholder="Quantity"
        >

        <button onclick="addProduct()">
            Add Product
        </button>

    </section>


    <!-- ========================= -->
    <!-- PRODUCTS -->
    <!-- ========================= -->

    <section>

        <h2>Products</h2>

        <ul id="productList"></ul>

    </section>


    <script>


        // =========================
        // PRODUCTS
        // =========================

        let products = [

            {
                name: "Laptop",
                price: 50000,
                quantity: 20
            },

            {
                name: "Phone",
                price: 22000,
                quantity: 50
            },

            {
                name: "Charger",
                price: 200,
                quantity: 65
            }

        ];


        // =========================
        // ADD PRODUCT
        // =========================

        function addProduct() {

            let name =
                document.getElementById("productName").value;

            let price =
                document.getElementById("productPrice").value;

            let quantity =
                document.getElementById("productQuantity").value;


            // Check inputs

            if (name == "" || price == ""||  quantity == "") {

                alert("Please enter all product information.");

                return;
            }


            // Create product object

            let product = {

                name: name,

                price: Number(price),

                quantity: Number(quantity)

            };


            // Add product to array
            products.push(product);


            // Update webpage

            displayProducts();

            calculateDashboard();


            // Clear inputs

            document.getElementById("productName").value = "";

            document.getElementById("productPrice").value = "";

            document.getElementById("productQuantity").value = "";

        }


        // =========================
        // DISPLAY PRODUCTS
        // =========================

        function displayProducts() {

            let list =
                document.getElementById("productList");


            // Clear old list

            list.innerHTML = "";


            // Loop through products

            for (let i = 0; i < products.length; i++) {

                list.innerHTML +=

                    "<li>" +

                    products[i].name +

                    " - " +

                    products[i].price +

                    " ETB - " +

                    products[i].quantity +

                    " pieces " +


                    // EDIT BUTTON

                    "<button onclick='editProduct(" +

                    i +

                    ")'>" +

                    "Edit" +

                    "</button>" +


                    // DELETE BUTTON

                    "<button class='delete' onclick='deleteProduct(" +

                    i +

                    ")'>" +

                    "Delete" +

                    "</button>" +


                    "</li>";

            }

        }


        // =========================
        // EDIT PRODUCT
        // =========================

        function editProduct(index) {


            // Ask for new information

            let newName =
                prompt(
                    "Enter new product name:",
                    products[index].name
                );


            let newPrice =
                prompt(
                    "Enter new price:",
                    products[index].price
                );


            let newQuantity =
                prompt(
                    "Enter new quantity:",
                    products[index].quantity
                );


            // Check if user cancelled

            if (
                newName == null ||
                newPrice == null ||
                newQuantity == null
            ) {

                return;

            }


            // Update product

            products[index].name = newName;

            products[index].price = Number(newPrice);

            products[index].quantity = Number(newQuantity);


            // Refresh webpage

            displayProducts();

            calculateDashboard();

        }


        // =========================
        // DELETE PRODUCT
        // =========================

        function deleteProduct(index) {


            products.splice(index, 1);


            // Refresh webpage

            displayProducts();

            calculateDashboard();

        }


        // =========================
        // CALCULATE DASHBOARD
        // =========================

        function calculateDashboard() {


            let totalProducts =
                products.length;


            let totalStock = 0;

            let totalValue = 0;


            // Calculate totals

            for (let i = 0; i < products.length; i++) {


                totalStock +=
                    products[i].quantity;


                totalValue +=
                    products[i].price *
                    products[i].quantity;

            }


            // Display totals

            document.getElementById("totalProducts").innerHTML =
                totalProducts;


            document.getElementById("totalStock").innerHTML =
                totalStock;


            document.getElementById("totalValue").innerHTML =
                totalValue + " ETB";

        }


        // =========================
        // INITIAL DISPLAY
        // =========================

        displayProducts();

        calculateDashboard();
        </script>

</body>

</html>
